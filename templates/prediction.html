{% extends 'base.html' %}
{% load static %}

{% block title %}
Loan Prediction | NaNeVora
{% endblock %}

{% block content %}

<section class="prediction-section">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-10">

                <div class="card shadow-lg border-0 rounded-4">

                    <div class="card-header bg-primary text-white text-center py-4">

                        <h2>

                            AI Loan Prediction

                        </h2>

                        <p class="mb-0">

                            Fill all applicant details carefully.

                        </p>

                    </div>

                    <div class="card-body p-5">

                        <form method="POST" id="predictionForm">

                            {% csrf_token %}

<!-- =====================================
Applicant Information
===================================== -->

<div class="row">

<div class="col-md-6 mb-4">

<label>No. of Dependents</label>

<input type="number"
name="no_of_dependents"
class="form-control"
min="0"
required>

</div>

<div class="col-md-6 mb-4">

<label>Education</label>

<select
name="education"
class="form-select"
required>

<option value="">Select</option>

<option value="Graduate">

Graduate

</option>

<option value="Not Graduate">

Not Graduate

</option>

</select>

</div>

<div class="col-md-6 mb-4">

<label>Self Employed</label>

<select
name="self_employed"
class="form-select"
required>

<option value="">Select</option>

<option value="Yes">

Yes

</option>

<option value="No">

No

</option>

</select>

</div>

<div class="col-md-6 mb-4">

<label>Annual Income (₹)</label>

<input
type="text"
id="annual_income"
name="income_annum"
class="form-control"
inputmode="numeric"
placeholder="Enter Annual Income"
required>

</div>

<div class="col-md-6 mb-4">

<label>Loan Amount (₹)</label>

<input
type="text"
id="loan_amount"
name="loan_amount"
class="form-control"
inputmode="numeric"
placeholder="Enter Loan Amount"
required>

</div>

<div class="col-md-6 mb-4">

<label>Loan Term (Months)</label>

<input
type="number"
name="loan_term"
class="form-control"
required>

</div>

<div class="col-md-6 mb-4">

<label>CIBIL Score</label>

<input
type="number"
name="cibil_score"
class="form-control"
min="300"
max="900"
required>

</div>
<div class="col-md-6 mb-4">

<label>Residential Assets (₹)</label>

<input
type="text"
name="residential_assets_value"
class="form-control"
inputmode="numeric"
placeholder="Enter Residential Assets"
required>

</div>

<div class="col-md-6 mb-4">

<label>Commercial Assets (₹)</label>

<input
type="text"
name="commercial_assets_value"
class="form-control"
inputmode="numeric"
placeholder="Enter Commercial Assets"
required>

</div>

<div class="col-md-6 mb-4">

<label>Luxury Assets (₹)</label>

<input
type="text"
name="luxury_assets_value"
class="form-control"
inputmode="numeric"
placeholder="Enter Luxury Assets"
required>

</div>

<div class="col-md-6 mb-4">

<label>Bank Assets (₹)</label>

<input
type="text"
name="bank_asset_value"
class="form-control"
inputmode="numeric"
placeholder="Enter Bank Assets"
required>

</div>

</div>

<hr class="my-4">

<div class="text-center">
<button
    type="submit"
    id="predictBtn"
    class="btn btn-primary btn-lg px-5">

    <i class="fa-solid fa-microchip me-2"></i>

    Predict Loan Status

</button>



</div>

</form>

</div>

</div>

</div>

</div>

</div>

</section>
{% endblock %}
{% block extra_js %}

<script src="{% static 'js/prediction.js' %}"></script>

<script src="{% static 'js/validation.js' %}"></script>

{% endblock %}
